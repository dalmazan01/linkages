<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />

    <link rel="stylesheet" href="normalize.css" />
    <link rel="stylesheet" href="index.css" />

    <script src="underscore-min.js"></script>
    <script src="jquery-1.9.1.min.js"></script>
    <script src="numeric-1.2.6.min.js"></script>

    <script src="nullspace.js"></script>
    <script src="linkage.js"></script>
    <script src="presets.js"></script>

    <script src="js/app-state.js"></script>
    <script src="js/rendering.js"></script>
    <script src="js/io.js"></script>
    <script src="js/actions.js"></script>
    <script src="js/simulation.js"></script>
    <script src="js/ui.js"></script>

  </head>
  <body>
    <div id="floating-controls">
      <button class="action-btn" id="btn-home" title="Center view on all nodes">⌂</button>
      <div class="divider"></div>
      <button class="action-btn" id="btn-undo" title="Undo">↩️</button>
      <button class="action-btn" id="btn-redo" title="Redo">↪️</button>
    
    <div class="divider"></div>
    
      <button class="action-btn" id="btn-zoom-in" title="Zoom In">➕</button>
      <button class="action-btn" id="btn-zoom-out" title="Zoom Out">➖</button>
    </div>
    <!-- Right Sidebar Toolbar -->
    <div id="toolbar">   
      <button id="btn-sidebar-toggle" title="Collapse sidebar">☰</button>
      <!-- Mode Toggle at top -->
      <div class="toolbar-section">
        <button id="btn-mode-toggle" class="toolbar-btn mode-toggle active" title="Switch between Edit and Play mode">
          <span class="btn-icon">✏️</span>
          <span class="btn-label">EDIT MODE</span>
        </button>
        <button id="btn-theme-toggle" class="toolbar-btn toggle-switch">
          <span class="toggle-label">🌗 Theme</span>
          <span class="toggle-track">
              <span class="toggle-thumb"></span>
          </span>
      </button>

        <button id="btn-complement-toggle" class="toolbar-btn toggle-switch">
          <span class="toggle-label">🔶 Comp. Highlight</span>
          <span class="toggle-track">
              <span class="toggle-thumb"></span>
          </span>
        </button>
      </div>  
      <div class="toolbar-separator-h"></div>

      <!-- EDIT MODE TOOLS (visible in edit mode) -->
      <div class="edit-mode-section">
        <div class="toolbar-section">
          <h3 class="toolbar-title">Edit Tools</h3>


          <button id="btn-select" class="toolbar-btn active" title="Select and drag nodes">
            <span class="btn-icon">👆</span>
            <span class="btn-label">Select</span>
          </button>

          <button id="btn-select-multi" class="toolbar-btn">
            <span class="icon">👆👆</span> 
            <span class="btn-label">Select Multiple</span>
          </button>

          <button id="btn-add-node" class="toolbar-btn " title="Click on canvas to add a node">
            <span class="btn-icon">●</span>
            <span class="btn-label">Add Node</span>
          </button>

          <button id="btn-add-edge" class="toolbar-btn" title="Select node, then Option+Click another">
            <span class="btn-icon">─</span>
            <span class="btn-label">Add Edge</span>
          </button>

          <button id="btn-toggle-node-open" class="toolbar-btn" title="Toggle selected node open/closed">
            <span class="btn-icon">◐</span>
            <span class="btn-label">Toggle Node</span>
          </button>

          <button id="btn-delete" class="toolbar-btn" title="Delete selected element">
            <span class="btn-icon">🗑</span>
            <span class="btn-label">Delete</span>
          </button>
          <button id="btn-copy" class="toolbar-btn" title="Copy selected nodes (Ctrl+C)" disabled>
            <span class="btn-icon">📋</span>
            <span class="btn-label">Copy</span>
          </button>
          <button id="btn-paste" class="toolbar-btn" title="Paste copied nodes (Ctrl+V)" disabled>
            <span class="btn-icon">📌</span>
            <span class="btn-label">Paste</span>
          </button>

          <button id="btn-label" class="toolbar-btn" title="Double-click nodes/edges to rename">
            <span class="btn-icon">🏷</span>
            <span class="btn-label">Label</span>
          </button>
        </div>
        <div class="toolbar-separator-h"></div>

      <!-- universal display controls (available in both modes) -->
      <div class="toolbar-section">
        <h3 class="toolbar-title">Display</h3>
        <button id="btn-toggle-labels" class="toolbar-btn active" title="Show/hide node and edge labels">
          <span class="btn-icon">🏷</span>
          <span class="btn-label">Show Labels</span>
        </button>
        <button id="btn-toggle-lengths" class="toolbar-btn" title="Show/hide edge lengths">
          <span class="btn-icon">🔢</span>
          <span class="btn-label">Show Lengths</span>
        </button>
        <button id="btn-zoom-in" class="toolbar-btn" title="Zoom in">
          <span class="btn-icon">➕</span>
          <span class="btn-label">Zoom In</span>
        </button>
        <button id="btn-zoom-out" class="toolbar-btn" title="Zoom out">
          <span class="btn-icon">➖</span>
          <span class="btn-label">Zoom Out</span>
        </button>
      </div>
      <!-- Hidden file input for XML upload -->
      <input type="file" id="xml-file-input" accept=".xml" style="display:none;" />

      <!-- Save button -->
        <button id="btn-save-xml" class="toolbar-btn">
          <span class="btn-icon">💾</span>
          <span class="btn-label">Save XML</span>
        </button>

        <button id="btn-save-svg" class="toolbar-btn">
          <span class="btn-icon">🖼️</span>
          <span class="btn-label">Save SVG</span>
        </button>

      <!-- Load button -->
        <button id="btn-load-xml" class="toolbar-btn">
          <span class="btn-icon">📂</span>
          <span class="btn-label">Load XML/SVG</span>
        </button>
        <div class="toolbar-section">
          <button id="btn-clear" class="toolbar-btn danger" title="Clear everything">
            <span class="btn-icon">⟲</span>
            <span class="btn-label">Clear All</span>
          </button>
        </div>
      </div>

      <!-- PLAY MODE TOOLS (visible in play mode, hidden by default) -->
      <div class="play-mode-section" style="display: none;">
        <div class="toolbar-section">
          <h3 class="toolbar-title">Play Tools</h3>

          <button id="btn-attractor" class="toolbar-btn" title="Place attractor with Shift+Click">
            <span class="btn-icon">🎯</span>
            <span class="btn-label">Attractor</span>
          </button>

          <button id="btn-fix" class="toolbar-btn" title="Fix selected node in place">
            <span class="btn-icon">📍</span>
            <span class="btn-label">Fix Node</span>
          </button>

          <button id="btn-toggle-node-open" class="toolbar-btn" title="Toggle selected node open/closed">
            <span class="btn-icon">◐</span>
            <span class="btn-label">Toggle Node</span>
          </button>
        </div>

        <div class="toolbar-separator-h"></div>

      <div class="toolbar-separator-h"></div>

        <div class="toolbar-section">
          <h3 class="toolbar-title">Trace Mode</h3>

          <button id="btn-trace" class="toolbar-btn" title="Trace motion of selected node">
            <span class="btn-icon">📈</span>
            <span class="btn-label">Trace</span>
          </button>

          <button id="btn-trace-play" class="toolbar-btn" title="Play trace">
            <span class="btn-icon">▶</span>
            <span class="btn-label">Play</span>
          </button>

          <button id="btn-trace-stop" class="toolbar-btn" title="Stop trace playback" disabled>
            <span class="btn-icon">⏹</span>
            <span class="btn-label">Stop</span>
          </button>

          <button id="btn-trace-loop" class="toolbar-btn active" title="Toggle loop/play once mode">
            <span class="btn-icon">🔁</span>
            <span class="btn-label">Loop</span>
          </button>
        </div>

        <div class="toolbar-separator-h"></div>

        <div class="toolbar-section">
          <h3 class="toolbar-title">Presets</h3>

          <button class="toolbar-btn preset-btn" data-preset="1">
            <span class="btn-label">Steric</span>
          </button>

          <button class="toolbar-btn preset-btn" data-preset="2">
            <span class="btn-label">Allosteric</span>
          </button>

          <button class="toolbar-btn preset-btn" data-preset="3">
            <span class="btn-label">Topological</span>
          </button>

          <button class="toolbar-btn preset-btn" data-preset="4">
            <span class="btn-label">Rigid</span>
          </button>

        </div>


        <div class="toolbar-separator-h"></div>


      </div>
    </div>

    <!-- Edge Context Menu -->
    <div id="edge-context-menu" style="display: none; position: absolute; background: #2c2c2c; border: 2px solid #4CAF50; border-radius: 8px; padding: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); z-index: 1000; min-width: 200px; color: white;">
        <div style="font-weight: bold; margin-bottom: 10px; color: #4CAF50; border-bottom: 1px solid #444; padding-bottom: 5px;">
            <span id="menu-edge-name">Edge E1</span>
        </div>
        <div style="margin-bottom: 8px; font-size: 12px; color: #aaa;">
            Current: <span id="menu-current-length">0</span> units
        </div>
        <div style="margin-bottom: 10px;">
            <input type="number" id="menu-length-input" step="1" min="1" placeholder="Enter new length" style="width: 100%; padding: 8px; background: #1a1a1a; border: 1px solid #555; border-radius: 4px; color: white; font-size: 14px;">
        </div>
        <div style="margin-bottom: 10px; display: flex; align-items: center; gap: 8px;">
            <label style="font-size: 13px; color: #aaa; flex-shrink: 0;">Edge color:</label>
            <input type="color" id="menu-color-input" value="#ff7700" style="width: 40px; height: 30px; border: none; border-radius: 4px; cursor: pointer; background: none;">
            <button id="menu-reset-color-btn" style="padding: 4px 8px; background: #555; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px;">Reset</button>
        </div>
        <button id="menu-set-length-btn" style="width: 100%; padding: 8px; background: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-bottom: 5px;">✓ Set Length</button>
        <button id="menu-rename-btn" style="width: 100%; padding: 8px; background: #2196F3; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-bottom: 5px;">✏️ Rename</button>
        <button id="menu-cancel-btn" style="width: 100%; padding: 8px; background: #666; color: white; border: none; border-radius: 4px; cursor: pointer;">✗ Cancel</button>
    </div>

    <div id="node-picker-menu"></div>

    <canvas id="canvas" width="800" height="800"></canvas>

  </body>
</html>
